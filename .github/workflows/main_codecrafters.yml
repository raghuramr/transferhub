# Deploy TransferHub to Azure App Service (codecrafters)
# Strategy: build UI (Vite) → copy dist into API public/ → build API (NestJS)
# → deploy src/api as the single deployable unit.
# The API's ServeStaticModule serves the React SPA; all /api/* routes go to NestJS.

name: Build and deploy to Azure Web App - codecrafters

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      # ── Build UI ──────────────────────────────────────────────────────────
      - name: Install UI dependencies
        working-directory: src/ui
        run: npm ci

      - name: Build UI (Vite)
        working-directory: src/ui
        run: npm run build
        # VITE_API_URL is intentionally left unset: it defaults to '/api' (relative),
        # which works because the API and UI share the same origin on Azure App Service.

      - name: Copy UI dist into API public/
        run: |
          mkdir -p src/api/public
          cp -r src/ui/dist/. src/api/public/

      # ── Build API ─────────────────────────────────────────────────────────
      - name: Install API dependencies
        working-directory: src/api
        run: npm ci

      - name: Build API (NestJS / tsc)
        working-directory: src/api
        run: npm run build

      # ── Prepare deployment package ────────────────────────────────────────
      # We deploy src/api (compiled dist/ + node_modules + public/).
      # Remove devDependencies to keep the artifact small.
      - name: Prune devDependencies for production
        working-directory: src/api
        run: npm prune --production

      # ── Deploy ────────────────────────────────────────────────────────────
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_CCB95B45FCC94A0A8F86C87442E1C005 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_1296AC8FD0554F6998229CD4259A2E6A }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_957BFFC6A0884E69835D3C1AE14D7B4E }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'codecrafters'
          slot-name: 'Production'
          package: src/api
